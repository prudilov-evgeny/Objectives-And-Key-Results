name: objectives-and-key-results

services:

  postgres:
    image: postgres:15-alpine
    container_name: objectives-and-key-results-postgres-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
#    volumes:
#      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - objectives-and-key-results-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: objectives-and-key-results-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_LIQUIBASE_CHANGE_LOG: classpath:db/changelog/db.changelog-master.yaml
#      SPRING_PROFILES_ACTIVE: scheduler
    ports:
      - "${APP_PORT}:8080"
    networks:
      - objectives-and-key-results-net

#volumes:
#  pgdata:

networks:
  objectives-and-key-results-net:
    driver: bridge
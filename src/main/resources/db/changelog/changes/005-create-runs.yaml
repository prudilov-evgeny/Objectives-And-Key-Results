databaseChangeLog:
  - changeSet:
      id: 005-create-runs
      author: eugene
      changes:
        - createTable:
            tableName: runs
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: snapshot_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: compared_to_run_id
                  type: VARCHAR(64)
              - column:
                  name: issues_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_runs_compared
            baseTableName: runs
            baseColumnNames: compared_to_run_id
            referencedTableName: runs
            referencedColumnNames: id
        - createIndex:
            indexName: idx_runs_snapshot
            tableName: runs
            columns:
              - column:
                  name: snapshot_date
      rollback:
        - dropTable:
            tableName: runs
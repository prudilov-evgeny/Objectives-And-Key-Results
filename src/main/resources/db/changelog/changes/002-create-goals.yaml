databaseChangeLog:
  - changeSet:
      id: 002-create-goals
      author: eugene
      changes:
        - createTable:
            tableName: goals
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: unit_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: owner
                  type: VARCHAR(255)
              - column:
                  name: parent_goal_id
                  type: VARCHAR(64)
              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: DATE
        - addForeignKeyConstraint:
            constraintName: fk_goals_unit
            baseTableName: goals
            baseColumnNames: unit_id
            referencedTableName: units
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_goals_parent
            baseTableName: goals
            baseColumnNames: parent_goal_id
            referencedTableName: goals
            referencedColumnNames: id
        - createIndex:
            indexName: idx_goals_unit
            tableName: goals
            columns:
              - column:
                  name: unit_id
        - createIndex:
            indexName: idx_goals_parent
            tableName: goals
            columns:
              - column:
                  name: parent_goal_id
        - createIndex:
            indexName: idx_goals_status
            tableName: goals
            columns:
              - column:
                  name: status
      rollback:
        - dropTable:
            tableName: goals
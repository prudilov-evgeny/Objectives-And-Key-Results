databaseChangeLog:
  - changeSet:
      id: 011-seed-runs
      author: eugene
      changes:
        - insert:
            tableName: runs
            columns:
              - column:
                  name: id
                  value: RUN-001
              - column:
                  name: snapshot_date
                  value: "2026-10-19"
              - column:
                  name: status
                  value: DONE
              - column:
                  name: compared_to_run_id
                  value: null
              - column:
                  name: issues_count
                  value: 3
        - insert:
            tableName: runs
            columns:
              - column:
                  name: id
                  value: RUN-002
              - column:
                  name: snapshot_date
                  value: "2026-10-26"
              - column:
                  name: status
                  value: DONE
              - column:
                  name: compared_to_run_id
                  value: RUN-001
              - column:
                  name: issues_count
                  value: 5
      rollback:
        - delete:
            tableName: runs
            where: id in ('RUN-001','RUN-002')
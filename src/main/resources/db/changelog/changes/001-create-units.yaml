databaseChangeLog:
  - changeSet:
      id: 001-create-units
      author: eugene
      changes:
        - createTable:
            tableName: units
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: VARCHAR(64)
        - addForeignKeyConstraint:
            constraintName: fk_units_parent
            baseTableName: units
            baseColumnNames: parent_id
            referencedTableName: units
            referencedColumnNames: id
        - createIndex:
            indexName: idx_units_parent
            tableName: units
            columns:
              - column:
                  name: parent_id
      rollback:
        - dropTable:
            tableName: units